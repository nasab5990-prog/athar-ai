name: ATHAR syntax checks

on:
  push:
    branches:
      - main
      - postgres-migration-test
  pull_request:
    branches:
      - main
      - postgres-migration-test

permissions:
  contents: read

jobs:
  syntax:
    name: JavaScript syntax validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript files
        run: npm run check
      - name: Generate dependency lock for audit
        run: npm install --package-lock-only --ignore-scripts
      - name: Audit production dependencies
        run: |
          npm audit --json > audit.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const audit = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          const meta = audit.metadata?.vulnerabilities || {};
          const lines = [
            '## ATHAR dependency security audit',
            '',
            `Production vulnerabilities: ${meta.total ?? 'unknown'} (critical: ${meta.critical ?? 0}, high: ${meta.high ?? 0}, moderate: ${meta.moderate ?? 0}, low: ${meta.low ?? 0})`,
            ''
          ];
          for (const [name, item] of Object.entries(audit.vulnerabilities || {})) {
            lines.push(`- **${name}** — severity: ${item.severity}; direct: ${item.isDirect}; installed: ${(item.range || 'unknown')}; fix: ${item.fixAvailable === false ? 'no automatic fix' : JSON.stringify(item.fixAvailable)}`);
            for (const via of item.via || []) {
              if (typeof via === 'object') lines.push(`  - ${via.title || via.name}: ${via.url || 'advisory URL unavailable'}`);
            }
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          console.log(JSON.stringify({vulnerabilities:audit.vulnerabilities || {}, metadata:meta}, null, 2));
          if ((meta.total || 0) > 0) process.exitCode = 1;
          NODE
