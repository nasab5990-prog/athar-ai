name: ATHAR syntax checks

on:
  push:
    branches:
      - main
      - postgres-migration-test
  pull_request:
    branches:
      - main
      - postgres-migration-test

permissions:
  contents: read

jobs:
  syntax:
    name: JavaScript syntax validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript files
        run: npm run check

  dependency-audit:
    name: Dependency vulnerability report
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve dependency lock for audit
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Report dependency advisories
        run: |
          npm audit --json > audit-report.json || true
          node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('audit-report.json','utf8')); const meta=r.metadata?.vulnerabilities || {}; console.log('Vulnerability totals:', JSON.stringify(meta)); for (const [name,v] of Object.entries(r.vulnerabilities || {})) console.log(JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==='string'?x:{name:x.name,title:x.title,url:x.url,range:x.range})})); if ((meta.total || 0)>0) process.exitCode=1;"
