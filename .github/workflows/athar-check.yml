name: ATHAR syntax checks

on:
  push:
    branches:
      - main
      - postgres-migration-test
  pull_request:
    branches:
      - main
      - postgres-migration-test

permissions:
  contents: read

jobs:
  syntax:
    name: JavaScript syntax validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript files
        run: npm run check
